[project]
name = "discord-mcp"
version = "0.1.0"
description = "Minimal MCP server for Discord forum and text channels"
authors = [
    { name = "siansiansu", email = "minsiansu@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx==0.28.1",
    "mcp==2.3.0",
]

[project.scripts]
discord-mcp = "discord_mcp.server:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "respx==0.23.1",
    "ruff==0.17.2",
    "ty==0.0.92",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812", "ISC001", "ANN401", "CPY", "EM", "TRY003", "FBT", "PLR2004"]

[tool.ty.environment]
python-version = "3.13"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501", "INP001", "ANN", "ARG001"]
